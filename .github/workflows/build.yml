name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platforms;android-33 build-tools;33.0.2 ndk;25.1.8937393 cmake;3.22.1"

    - name: Install System Gradle
      run: sudo apt-get update && sudo apt-get install -y gradle

    - name: Build with System Gradle
      run: gradle assembleRelease || gradle build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: universal-apk
        path: "**/build/outputs/apk/**/*.apk"
